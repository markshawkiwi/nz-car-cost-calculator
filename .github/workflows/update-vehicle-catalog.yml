name: Update NZTA vehicle catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalogue from NZTA open data
        run: python scripts/build_vehicle_catalog.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/vehicles.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vehicles.json
          git commit -m "Update NZTA vehicle catalogue"
          git push
